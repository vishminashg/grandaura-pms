[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: any path that doesn't match a built file falls back to
# index.html so client-side tab routing keeps working on refresh/deep links.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
